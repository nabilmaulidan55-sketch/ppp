<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Finance Ultimate</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<script>
if(!localStorage.getItem("currentUser")){
window.location.href="login.html";
}
</script>

<div class="container">

<div class="top-bar">
<h1>💎 Finance Ultimate</h1>
<div>
<button id="toggleMode">🌙</button>
<button onclick="logout()">Logout</button>
</div>
</div>

<div class="summary">
<div class="card income-card">
<h3>Pemasukan</h3>
<p id="totalIncome">Rp 0</p>
</div>

<div class="card expense-card">
<h3>Pengeluaran</h3>
<p id="totalExpense">Rp 0</p>
</div>

<div class="card balance-card">
<h3>Saldo</h3>
<p id="balance">Rp 0</p>
</div>
</div>

<div class="target-box">
<h3>Target Tabungan</h3>
<input type="number" id="savingTarget" placeholder="Masukkan Target">
<div class="progress-bar">
<div id="progressFill"></div>
</div>
<p id="savingProgress"></p>
</div>

<form id="form">
<input type="text" id="description" placeholder="Keterangan" required>
<select id="type">
<option value="income">Pemasukan</option>
<option value="expense">Pengeluaran</option>
</select>
<input type="number" id="amount" placeholder="Jumlah uang" required>
<button type="submit">Tambah</button>
</form>

<div class="filter-box">
<select id="filter">
<option value="all">Semua</option>
<option value="income">Pemasukan</option>
<option value="expense">Pengeluaran</option>
</select>
<button onclick="exportPDF()">Export PDF</button>
</div>

<canvas id="financeChart"></canvas>

<ul id="transaction-list"></ul>

<button id="reset">Reset Semua Data</button>

</div>

<script src="script.js"></script>
</body>
</html>
